services:
  mcp-server:
    build:
      context: .
      dockerfile: mcp-server/Dockerfile
    restart: unless-stopped
    environment:
      - MCP_SERVER_TOKEN=${MCP_SERVER_TOKEN:?Set MCP_SERVER_TOKEN in .env - see mcp-server/README.md}
      - PORT=3000
    expose:
      - "3000"
    networks:
      - mcp
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Reverse proxy terminating TLS. Requires MCP_DOMAIN to point at this host
  # (A/AAAA record) so Caddy can obtain a Let's Encrypt certificate
  # automatically. Swap this service for nginx/Traefik if you already run
  # one of those - it only needs to forward to mcp-server:3000.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - MCP_DOMAIN=${MCP_DOMAIN:?Set MCP_DOMAIN in .env - see mcp-server/README.md}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - mcp-server
    networks:
      - mcp

volumes:
  caddy_data:
  caddy_config:

networks:
  mcp:
