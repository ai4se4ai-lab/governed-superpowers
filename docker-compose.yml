services:
  # ---------------------------------------------------------------- data
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-governed}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env - see .env.example}
      - POSTGRES_DB=${POSTGRES_DB:-governed}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - mcp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-governed} -d ${POSTGRES_DB:-governed}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # One-shot: applies pending Prisma migrations, then exits. Not started by
  # `docker compose up` - run it explicitly before (re)starting the app
  # services whenever the schema has changed:
  #   docker compose run --build --rm migrate
  #
  # Pass --build. `docker compose run` reuses an already-built image, so on an
  # upgrade it would otherwise run the previous deployment's migrator, which
  # does not contain the newly added migration directories - the migration is
  # skipped silently and the app then starts against a database missing its
  # tables. scripts/docker-up.* always pass it.
  migrate:
    build:
      context: ./web
      dockerfile: Dockerfile
      target: migrator
    environment:
      - DATABASE_URL=${DATABASE_URL:?Set DATABASE_URL in .env - see .env.example}
      - DIRECT_URL=${DIRECT_URL:?Set DIRECT_URL in .env - see .env.example}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mcp
    restart: "no"

  # ---------------------------------------------------------------- apps
  # Account portal: signup, email confirmation, profile, MCP token management.
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL:?Set DATABASE_URL in .env - see .env.example}
      - APP_URL=${APP_URL:-http://localhost:3000}
      - SMTP_HOST=${SMTP_HOST:?Set SMTP_HOST in .env - see .env.example}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - MAIL_FROM=${MAIL_FROM:-Governed-Superpowers <no-reply@localhost>}
      - PORT=3000
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mcp
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # MCP server. Authenticates every /mcp request against tokens minted in the
  # portal above - there is no shared static token.
  #
  # It reads McpToken to verify those tokens, and (since the collaboration-graph
  # tools) also WRITES the Project/Graph* tables when a user publishes a graph.
  # DATABASE_URL therefore needs INSERT/UPDATE/DELETE on them, not just SELECT -
  # the bundled db and a stock Supabase connection string both already do.
  mcp-server:
    build:
      context: .
      dockerfile: mcp-server/Dockerfile
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL:?Set DATABASE_URL in .env - see .env.example}
      - PORT=3000
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mcp
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------- edge
  # Reverse proxy terminating TLS. Requires APP_DOMAIN to point at this host
  # (A/AAAA record) so Caddy can obtain a Let's Encrypt certificate
  # automatically. Swap this service for nginx/Traefik if you already run one
  # of those - see Caddyfile for the routing it has to reproduce.
  #
  # On hosts where a proxy you don't control already terminates TLS for
  # APP_DOMAIN and forwards to one port on this host (shared/campus hosting),
  # Caddy can't get its own cert or bind 80/443 - set CADDYFILE_PATH=
  # ./Caddyfile.behind-proxy and CADDY_HTTP_PORT=<the port that proxy
  # forwards to> in .env instead. See Caddyfile.behind-proxy.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    environment:
      - APP_DOMAIN=${APP_DOMAIN:?Set APP_DOMAIN in .env - see .env.example}
    volumes:
      - ${CADDYFILE_PATH:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - mcp-server
    networks:
      - mcp

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  mcp:
